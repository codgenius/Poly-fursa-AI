services:
  yolo:
    build:
      context: ./services/yolo
    image: hadikhier/yolo-service:${YOLO_IMAGE_TAG:-0.0.1}
    ports:
      - "8080:8080"
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    volumes:
      - yolo-db:/app/data
      - ~/.aws:/root/.aws:ro
    logging:
      driver: json-file
      options:
        labels: "com.docker.compose.service"
    networks:
      - polyai-net

  agent:
    build:
      context: ./services/agent
    image: hadikhier/agent-service:${AGENT_IMAGE_TAG:-0.0.2}
    ports:
      - "8000:8000"
    environment:
      YOLO_SERVICE_URL: http://yolo:8080
      MCP_SERVICE_URL: http://img-proc-mcp:9000/mcp
      MODEL: bedrock:amazon.nova-micro-v1:0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    networks:
      - polyai-net
    depends_on:
      - yolo
      - img-proc-mcp
    volumes:
      - ~/.aws:/root/.aws:ro
    logging:
      driver: json-file
      options:
        labels: "com.docker.compose.service"

  img-proc-mcp:
    build:
      context: ./services/img-proc-mcp
    image: hadikhier/img-proc-mcp:${MCP_IMAGE_TAG:-0.0.1}
    ports:
      - "9000:9000"
    networks:
      - polyai-net
    volumes:
      - ~/.aws:/root/.aws:ro
    logging:
      driver: json-file
      options:
        labels: "com.docker.compose.service"

  frontend:
    build:
      context: ./services/frontend
      args:
        NEXT_PUBLIC_AGENT_URL: http://localhost:8000
    image: hadikhier/frontend-service:${FRONTEND_IMAGE_TAG:-0.0.1}
    ports:
      - "3000:3000"
    networks:
      - polyai-net
    depends_on:
      - agent
    logging:
      driver: json-file
      options:
        labels: "com.docker.compose.service"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - monitoring-net
      - polyai-net
    depends_on:
      - yolo
    logging:
      driver: json-file
      options:
        labels: "com.docker.compose.service"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3001"
    environment:
      GF_SERVER_HTTP_PORT: 3001
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        labels: "com.docker.compose.service"

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - monitoring-net
    logging:
      driver: json-file
      options:
        labels: "com.docker.compose.service"

  fluent-bit:
    image: fluent/fluent-bit:4.2.7
    restart: unless-stopped
    environment:
      AWS_REGION: ${AWS_REGION}
      S3_LOGS_BUCKET: ${S3_LOGS_BUCKET}
      HOSTNAME: ${LOG_HOST:-polyai-dev}
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log
    logging:
      driver: json-file
      options:
        labels: "com.docker.compose.service"

volumes:
  grafana-storage:
  prometheus-data:
  yolo-db:

networks:
  polyai-net:
    driver: bridge
  monitoring-net:
    driver: bridge
