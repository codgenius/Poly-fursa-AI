name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test-yolo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install YOLO dependencies
        run: |
          pip install -r services/yolo/torch-requirements.txt
          pip install -r services/yolo/requirements.txt

      - name: Run YOLO tests with coverage
        run: pytest
        working-directory: services/yolo

      - name: Upload YOLO coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./services/yolo/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: yolo

  test-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Agent dependencies
        run: |
          pip install -r services/agent/requirements.txt

      - name: Run Agent tests with coverage
        run: pytest
        working-directory: services/agent

      - name: Upload Agent coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./services/agent/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: agent