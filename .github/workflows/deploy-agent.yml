name: Deploy Agent Service

on:
  workflow_call:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Agent service
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agent-service:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/agent-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/agent-service:buildcache,mode=max

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v1
        with:
          host: dev.hadi.fursa.click
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Poly-fursa-AI
            git fetch origin
            git checkout dev
            git pull --ff-only origin dev
            
            touch .env
            
            TAG="${{ steps.tag.outputs.tag }}"
            
            if grep -q '^AGENT_IMAGE_TAG=' .env; then
              sed -i "s|^AGENT_IMAGE_TAG=.*|AGENT_IMAGE_TAG=${TAG}|" .env
            else
              echo "AGENT_IMAGE_TAG=${TAG}" >> .env
            fi
            
            docker compose pull agent
            docker compose up -d --no-deps agent
            docker compose ps agent

      - name: Deploy to Prod
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: prod.hadi.fursa.click
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Poly-fursa-AI
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            
            touch .env
            
            TAG="${{ steps.tag.outputs.tag }}"
            
            if grep -q '^AGENT_IMAGE_TAG=' .env; then
              sed -i "s|^AGENT_IMAGE_TAG=.*|AGENT_IMAGE_TAG=${TAG}|" .env
            else
              echo "AGENT_IMAGE_TAG=${TAG}" >> .env
            fi
            
            docker compose pull agent
            docker compose up -d --no-deps agent
            docker compose ps agent
