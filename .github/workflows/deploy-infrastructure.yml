name: Deploy Infrastructure

on:
  workflow_call:

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v1
        with:
          host: dev.hadi.fursa.click
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Poly-fursa-AI
            git fetch origin
            git checkout dev
            git pull --ff-only origin dev

            # Ensure host-specific configuration in .env
            touch .env
            
            # Set ALLOWED_ORIGINS for dev environment (replace if exists, append if not)
            if grep -q '^ALLOWED_ORIGINS=' .env; then
              sed -i 's|^ALLOWED_ORIGINS=.*|ALLOWED_ORIGINS=http://dev.hadi.fursa.click:3000|' .env
            else
              echo "ALLOWED_ORIGINS=http://dev.hadi.fursa.click:3000" >> .env
            fi

            # Load environment variables from .env (if exists)
            set -a
            [ -f .env ] && source .env
            set +a

            # Pull latest images (uses tags already set on instances)
            docker compose pull

            # Bring up entire stack
            docker compose up -d

            # Show status
            docker compose ps

      - name: Deploy to Prod
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: prod.hadi.fursa.click
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Poly-fursa-AI
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            # Ensure host-specific configuration in .env
            touch .env
            
            # Set ALLOWED_ORIGINS for prod environment (replace if exists, append if not)
            if grep -q '^ALLOWED_ORIGINS=' .env; then
              sed -i 's|^ALLOWED_ORIGINS=.*|ALLOWED_ORIGINS=http://prod.hadi.fursa.click:3000|' .env
            else
              echo "ALLOWED_ORIGINS=http://prod.hadi.fursa.click:3000" >> .env
            fi

            # Load environment variables from .env (if exists)
            set -a
            [ -f .env ] && source .env
            set +a

            # Pull latest images (uses tags already set on instances)
            docker compose pull

            # Bring up entire stack
            docker compose up -d

            # Show status
            docker compose ps
