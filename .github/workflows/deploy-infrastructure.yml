name: Deploy Infrastructure

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'docker-compose.yml'
      - 'monitoring/**'
      - '.env.example'
      - '.github/workflows/deploy-infrastructure.yml'

concurrency:
  group: polyai-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v1
        with:
          host: dev.hadi.fursa.click
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Poly-fursa-AI
            git fetch origin
            git checkout dev
            git pull --ff-only origin dev

            # Load environment variables from .env (if exists)
            set -a
            [ -f .env ] && source .env
            set +a

            # Pull latest images (uses tags already set on instances)
            docker compose pull

            # Bring up entire stack
            docker compose up -d

            # Show status
            docker compose ps

      - name: Deploy to Prod
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: prod.hadi.fursa.click
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Poly-fursa-AI
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            # Load environment variables from .env (if exists)
            set -a
            [ -f .env ] && source .env
            set +a

            # Pull latest images (uses tags already set on instances)
            docker compose pull

            # Bring up entire stack
            docker compose up -d

            # Show status
            docker compose ps
