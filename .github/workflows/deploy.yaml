name: Deploy PolyAI

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Poly-fursa-AI
            git fetch origin
            git checkout dev
            git pull origin dev

            source .venv/bin/activate

            pip install -r services/yolo/torch-requirements.txt
            pip install -r services/yolo/requirements.txt
            pip install -r services/agent/requirements.txt

            cd /home/ubuntu/Poly-fursa-AI/services/frontend
            npm install

            sudo systemctl restart yolo.service
            sudo systemctl restart poly-agent.service
            sudo systemctl restart poly-frontend.service

            sudo systemctl status yolo.service --no-pager
            sudo systemctl status poly-agent.service --no-pager
            sudo systemctl status poly-frontend.service --no-pager

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Poly-fursa-AI
            git fetch origin
            git checkout main
            git pull origin main

            source .venv/bin/activate

            pip install -r services/yolo/torch-requirements.txt
            pip install -r services/yolo/requirements.txt
            pip install -r services/agent/requirements.txt

            cd /home/ubuntu/Poly-fursa-AI/services/frontend
            npm install

            sudo systemctl restart yolo.service
            sudo systemctl restart poly-agent.service
            sudo systemctl restart poly-frontend.service

            sudo systemctl status yolo.service --no-pager
            sudo systemctl status poly-agent.service --no-pager
            sudo systemctl status poly-frontend.service --no-pager