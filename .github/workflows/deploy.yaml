name: Deploy PolyAI Stack

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: set-tag
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Build and push YOLO service
        uses: docker/build-push-action@v5
        with:
          context: ./services/yolo
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/yolo-service:${{ steps.set-tag.outputs.tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/yolo-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/yolo-service:buildcache,mode=max

      - name: Build and push Agent service
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agent-service:${{ steps.set-tag.outputs.tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/agent-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/agent-service:buildcache,mode=max

      - name: Build and push Frontend service
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:${{ steps.set-tag.outputs.tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:buildcache,mode=max

      - name: Build and push Image Processing MCP service
        uses: docker/build-push-action@v5
        with:
          context: ./services/img-proc-mcp
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/img-proc-mcp:${{ steps.set-tag.outputs.tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/img-proc-mcp:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/img-proc-mcp:buildcache,mode=max

  deploy-dev:
    name: Deploy to Dev Instance
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Dev
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Poly-fursa-AI
            git fetch origin
            git checkout dev
            git pull origin dev

            # Export image tags as environment variables
            export YOLO_IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/yolo-service:${{ needs.build-and-push.outputs.image-tag }}"
            export AGENT_IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/agent-service:${{ needs.build-and-push.outputs.image-tag }}"
            export FRONTEND_IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:${{ needs.build-and-push.outputs.image-tag }}"
            export MCP_IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/img-proc-mcp:${{ needs.build-and-push.outputs.image-tag }}"
            
            # Load environment variables from .env
            set -a
            [ -f .env ] && source .env
            set +a

            # Pull latest images and restart stack
            docker-compose pull
            docker-compose up -d

            # Wait for services to be healthy
            sleep 10

            # Show status
            docker-compose ps

  deploy-prod:
    name: Deploy to Prod Instance
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Poly-fursa-AI
            git fetch origin
            git checkout main
            git pull origin main

            # Export image tags as environment variables
            export YOLO_IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/yolo-service:${{ needs.build-and-push.outputs.image-tag }}"
            export AGENT_IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/agent-service:${{ needs.build-and-push.outputs.image-tag }}"
            export FRONTEND_IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:${{ needs.build-and-push.outputs.image-tag }}"
            export MCP_IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/img-proc-mcp:${{ needs.build-and-push.outputs.image-tag }}"
            
            # Load environment variables from .env
            set -a
            [ -f .env ] && source .env
            set +a

            # Pull latest images and restart stack
            docker-compose pull
            docker-compose up -d

            # Wait for services to be healthy
            sleep 10

            # Show status
            docker-compose ps