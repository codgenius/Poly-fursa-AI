apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
  - host: agent.hadi-polyai.fursa.click
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agent
            port:
              number: 8000
