apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: img-proc-mcp-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/codgenius/Poly-fursa-AI.git
    targetRevision: main
    path: infra/k8s/prod/04-mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
