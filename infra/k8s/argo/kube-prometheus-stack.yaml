apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # Pin to a specific chart version for reproducibility.
    # Verify the latest stable version at:
    #   https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
    targetRevision: "67.3.1"
    helm:
      valueFiles:
      - $values/infra/k8s/monitoring/values.yaml
  - repoURL: https://github.com/codgenius/Poly-fursa-AI.git
    # Track the same branch where values.yaml lives.
    # Change to main when this Application is promoted to the main branch.
    targetRevision: dev
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # ServerSideApply is required because kube-prometheus-stack CRDs exceed
    # the annotation size limit enforced by client-side apply.
    - ServerSideApply=true
