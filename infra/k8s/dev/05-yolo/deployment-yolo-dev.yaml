apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolo
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolo
  template:
    metadata:
      labels:
        app: yolo
    spec:
      containers:
      - name: yolo
        image: hadikhier/yolo-service:0.0.1
        ports:
        - containerPort: 8080
        env:
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_S3_BUCKET
          value: "hadi-polyai-images-hk2026"
        volumeMounts:
        - name: yolo-db
          mountPath: /app/data
      volumes:
      - name: yolo-db
        emptyDir: {}