apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent
  namespace: dev
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: agent
  namespaceSelector:
    matchNames:
    - dev
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
