apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
      - name: agent
        image: hadikhier/agent-service:0.0.2
        ports:
        - containerPort: 8000
        env:
        - name: YOLO_SERVICE_URL
          value: "http://yolo:8080"
        - name: MCP_SERVICE_URL
          value: "http://img-proc-mcp:9000/mcp"
        - name: MODEL
          value: "bedrock:amazon.nova-micro-v1:0"
        - name: ALLOWED_ORIGINS
          value: "http://localhost:3000"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_S3_BUCKET
          value: "hadi-polyai-images-hk2026"
